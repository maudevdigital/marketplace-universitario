server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # React Router maneja las rutas en el navegador: cualquier dirección que no sea
  # un archivo existente (por ejemplo /usuarios/3) devuelve index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Los archivos de /assets llevan una huella en el nombre: se pueden guardar en caché por mucho tiempo.
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
